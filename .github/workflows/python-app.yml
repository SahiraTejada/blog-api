# Workflow name - appears in GitHub Actions UI
name: FastAPI Code Quality

# Trigger conditions - when this workflow runs
on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]

# Permissions needed for auto-commit
permissions:
  contents: write

jobs:
  code-quality:
    runs-on: ubuntu-latest  # Use Ubuntu as the virtual machine OS
    
    # Matrix strategy - runs the job multiple times with different Python versions
    strategy:
      matrix:
        python-version: ["3.12"]  # Test against 4 Python versions
    
    steps:
    # Step 1: Clone the repository code
    - uses: actions/checkout@v4
    
    # Step 2: Install the specified Python version
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    # Step 3: Cache pip dependencies to speed up workflow
    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip  # Directory where pip stores downloaded packages
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}  # Unique cache key
        restore-keys: |
          ${{ runner.os }}-pip-  # Fallback cache key if exact match not found
    
    # Step 4: Install project dependencies
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip  # Update pip to latest version
        pip install -r requirements.txt      # Install production dependencies
    
    
    # Step 5: Auto-format code with isort and autopep8
    - name: Auto-format code
      run: |
        pip install isort autopep8
        isort .  # Fix import sorting
        autopep8 --in-place --recursive --aggressive .  # Fix formatting (E302, D202, W292, etc.)

    # Step 6: Commit formatting changes (if any)
    - name: Commit formatting changes
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git diff --quiet || (git add -A && git commit -m "style: auto-format code [skip ci]")
        git push || echo "No changes to push"

    # Step 7: Check no imports inside functions
    - name: Check imports are at module level
      run: |
        python -c "
        import ast, os, sys
        errors = []
        for root, dirs, files in os.walk('app'):
            dirs[:] = [d for d in dirs if d != '__pycache__']
            for f in files:
                if not f.endswith('.py'):
                    continue
                path = os.path.join(root, f)
                with open(path) as fh:
                    try:
                        tree = ast.parse(fh.read())
                    except SyntaxError:
                        continue
                for node in ast.walk(tree):
                    if not isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)):
                        continue
                    for child in ast.walk(node):
                        if isinstance(child, (ast.Import, ast.ImportFrom)):
                            mod = child.module if isinstance(child, ast.ImportFrom) else ', '.join(a.name for a in child.names)
                            errors.append(f'{path}:{child.lineno} in {node.name}() -> {mod}')
        if errors:
            print('ERROR: Imports found inside functions (move them to the top of the file):')
            for e in errors:
                print(f'  {e}')
            sys.exit(1)
        print('OK: All imports are at module level')
        "

    # Step 8: Lint code with Flake8 + bugbear
    - name: Run Flake8 (linting)
      run: |
        pip install flake8 flake8-bugbear flake8-docstrings  # Install flake8 + bugbear + docstrings
        flake8 . --count --show-source --statistics  # Check for errors, show source and stats

    # Step 7: Type checking with Mypy
    - name: Run Mypy (type checking)
      run: |
        pip install mypy types-requests types-redis  # Install mypy + type stubs
        mypy . --ignore-missing-imports  # Basic type checking without overly strict warnings
    
    # # Step 8: Security vulnerability scanning with Bandit (optional - uncomment if needed)
    # - name: Run Bandit (security check)
    #   run: |
    #     pip install bandit[toml]  # Install bandit with TOML config support
    #     bandit -r . -ll  # -r: recursive scan | -ll: only report medium/high severity issues

    # Step 9: Check for known security vulnerabilities in dependencies
    # - name: Run Safety (dependency vulnerability check)
    #   run: |
    #     pip install safety
    #     safety scan --target .  # Scan project for known dependency vulnerabilities