# Workflow name - appears in GitHub Actions UI
name: FastAPI Code Quality

# Trigger conditions - when this workflow runs
on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]

jobs:
  code-quality:
    runs-on: ubuntu-latest  # Use Ubuntu as the virtual machine OS
    
    # Matrix strategy - runs the job multiple times with different Python versions
    strategy:
      matrix:
        python-version: ["3.12"]  # Test against 4 Python versions
    
    steps:
    # Step 1: Clone the repository code
    - uses: actions/checkout@v4
    
    # Step 2: Install the specified Python version
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    # Step 3: Cache pip dependencies to speed up workflow
    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip  # Directory where pip stores downloaded packages
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}  # Unique cache key
        restore-keys: |
          ${{ runner.os }}-pip-  # Fallback cache key if exact match not found
    
    # Step 4: Install project dependencies
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip  # Update pip to latest version
        pip install -r requirements.txt      # Install production dependencies
    
    
    # Step 6: Check import sorting with isort
    - name: Run isort (import sorting)
      run: |
        pip install isort
        isort --check-only --diff .  # Verify imports are sorted, show differences
    
    # Step 7: Lint code with Flake8
    - name: Run Flake8 (linting)
      run: |
        pip install flake8 flake8-docstrings flake8-bugbear # Install flake8 + plugins
        flake8 . --count --show-source --statistics  # Check for errors, show source and stats
    
    # Step 8: Advanced static analysis with Pylint
    - name: Run Pylint
      run: |
        pip install pylint
        pylint $(git ls-files '*.py')  # Analyze all Python files tracked by git
    
    # Step 9: Type checking with Mypy
    - name: Run Mypy (type checking)
      run: |
        pip install mypy types-requests types-redis  # Install mypy + type stubs
        mypy . --ignore-missing-imports --warn-unused-ignores --warn-redundant-casts --warn-unused-configs
        # --ignore-missing-imports: don't fail on missing type stubs
        # --warn-unused-ignores: warn about unnecessary "type: ignore" comments
        # --warn-redundant-casts: warn about unnecessary casts
        # --warn-unused-configs: warn about unused config settings
    
    # # Step 10: Security vulnerability scanning with Bandit
    # - name: Run Bandit (security check)
    #   run: |
    #     pip install bandit[toml]  # Install bandit with TOML config support
    #     bandit -r . -ll  # -r: recursive scan | -ll: only report medium/high severity issues
    
    # Step 11: Check for known security vulnerabilities in dependencies
    - name: Run Safety (dependency vulnerability check)
      run: |
        pip install safety
        safety check  # Scan installed packages against safety database